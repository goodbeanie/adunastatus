<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aduna status</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14151a; color: #e8e9ee; font-family: system-ui, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 420px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { margin: 0; color: #a9acb8; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1 id="title">Aduna</h1>
  <p id="msg">Checking the server...</p>
</main>
<script>
fetch('status.json', { cache: 'no-store' })
  .then((r) => r.json())
  .then((s) => {
    document.getElementById('title').textContent = s.down ? 'Aduna is down' : 'Aduna';
    document.getElementById('msg').textContent = s.message || (s.down ? 'Back soon.' : 'No known problems.');
  })
  .catch(() => { document.getElementById('msg').textContent = 'Could not load the status.'; });
</script>
</body>
</html>
